function loadSave(){
  try{
    const s = localStorage.getItem('skocipero_save_v1');
    if(s){
      const o = JSON.parse(s);
      if(typeof o.wallet === 'number') save.wallet = o.wallet;
      if(Array.isArray(o.owned) && o.owned.length) save.owned = o.owned;
      if(typeof o.selected === 'string') save.selected = o.selected;
      if(typeof o.checkpoint === 'number') save.checkpoint = o.checkpoint;
      if(typeof o.unlockedLevels === 'number') save.unlockedLevels = o.unlockedLevels;
      if(Array.isArray(o.bonuses)) save.bonuses = o.bonuses;
      if(typeof o.inputMode === 'string') save.inputMode = o.inputMode;
    }
  }catch(e){}
  save.owned = save.owned.map(x => x === 'max' ? 'mate' : x);
  if(save.selected === 'max') save.selected = 'mate';
  if(!save.owned.includes('pero')) save.owned.push('pero');
  if(!save.owned.includes(save.selected)) save.selected = 'pero';
  if(!CHECKPOINTS.includes(save.checkpoint) && save.checkpoint !== TOTAL_LEVELS){
    if(save.checkpoint >= 7) save.checkpoint = 7;
    else if(save.checkpoint >= 4) save.checkpoint = 4;
    else save.checkpoint = 1;
  }
  if(save.unlockedLevels < 1) save.unlockedLevels = 1;
  if(save.unlockedLevels > TOTAL_LEVELS) save.unlockedLevels = TOTAL_LEVELS;
  if(save.unlockedLevels < save.checkpoint) save.unlockedLevels = save.checkpoint;
  if(!['auto','pc','mobile'].includes(save.inputMode)) save.inputMode = 'auto';
}

let actx = null;
function beep(freq, dur, type='square', vol=0.05, slideTo){
  if(!soundOn) return;
  try{
    if(!actx) actx = new (window.AudioContext||window.webkitAudioContext)();
    const t = actx.currentTime;
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if(slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20,slideTo), t+dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    o.connect(g); g.connect(actx.destination);
    o.start(t); o.stop(t+dur+0.02);
  }catch(e){}
}

function makeBuilder(){
  const set  = (r,c,v) => { if(r>=0&&r<ROWS&&c>=0&&c<levelCols) grid[r][c]=v; };
  const fill = (r1,c1,r2,c2,v) => { for(let r=r1;r<=r2;r++) for(let c=c1;c<=c2;c++) set(r,c,v); };
  const pipe = (c,h) => fill(15-h, c, 14, c+1, 5);
  const coin = (c,r) => coins.push({ x:c*TILE+16, y:r*TILE+16, taken:false, t:Math.random()*6.28 });
  const coinRow = (c1,c2,r) => { for(let c=c1;c<=c2;c++) coin(c,r); };
  const enemy = (c, r=15) => enemies.push({
    x:c*TILE+3, y:r*TILE-26, w:26, h:26,
    vx:-1.1, vy:0, dir:-1, speed:1.1,
    onGround:false, alive:true, squash:0, active:false, remove:false, isEnemy:true, kind:'walker'
  });
  const bird = (c, r) => enemies.push({
    x:c*TILE, y:r*TILE, w:22, h:18,
    vx:-1.4, vy:0, dir:-1, speed:1.4,
    baseY: r*TILE, phase: Math.random()*6.28, amp: 26,
    onGround:false, alive:true, squash:0, active:false, remove:false, isEnemy:true, kind:'bird'
  });
  const spider = (c, r) => enemies.push({
    x:c*TILE + 6, y:r*TILE, w:20, h:20,
    baseY: r*TILE, phase: Math.random()*6.28, amp: 55, speed: 0.55,
    onGround:false, alive:true, squash:0, active:false, remove:false, isEnemy:true, kind:'spider'
  });
  const jumper = (c, r=15) => enemies.push({
    x:c*TILE+3, y:r*TILE-26, w:26, h:26,
    vx:0, vy:0, dir:-1, speed:0.55,
    jumpTimer: 30 + Math.random()*60,
    onGround:false, alive:true, squash:0, active:false, remove:false, isEnemy:true, kind:'jumper'
  });
  const fireball = (c, r) => enemies.push({
    x:c*TILE + 8, y:r*TILE, w:16, h:16,
    baseY: r*TILE, phase: Math.random()*6.28, amp: 20, speed: 1.4,
    onGround:false, alive:true, squash:0, active:false, remove:false, isEnemy:true, kind:'fireball'
  });
  const stairsUp = (c0,h) => { for(let i=0;i<h;i++) fill(14-i, c0+i, 14, c0+i, 1); };
  const qblock = (c,r,item='coin') => { set(r,c,3); blockItems[r*levelCols+c] = item; };
  const spike = (c,r) => set(r,c,6);
  const ceilSpike = (c,r) => set(r,c,7);
  const spikeBall = (c, rFrom, rTo) => hazards.push({
    x: c*TILE + TILE/2, baseX: c*TILE + TILE/2,
    r: 12, y: rFrom*TILE, baseY: rFrom*TILE,
    minY: rFrom*TILE, maxY: rTo*TILE,
    vy: 1.6, t: Math.random()*6.28
  });
  return { set, fill, pipe, coin, coinRow, enemy, bird, spider, jumper, fireball,
           stairsUp, qblock, spike, ceilSpike, spikeBall };
}

function initAmbients(){
  ambients = [];
  if(!currentTheme) return;
  const th = currentTheme.bg;
  let palette = ['#ffffff'];
  let count = 30, vy = 0.3, vxRange = 0.4, glow = false;
  if(th === 'hills'){ palette = ['#ffe082','#fff9c4','#c8e6c9']; count = 32; vy = -0.15; }
  else if(th === 'mountains'){ palette = ['#ffcc80','#e0b080']; count = 24; }
  else if(th === 'forest'){ palette = ['#fff59d','#ffeb3b','#aed581']; count = 36; vy = -0.1; glow = true; }
  else if(th === 'sky'){ palette = ['#ffffff','#e0f7fa']; count = 40; vy = -0.2; }
  else if(th === 'dungeon'){ palette = ['#a0a0b0','#707080']; count = 28; }
  else if(th === 'castle'){ palette = ['#ff7043','#ffab40']; count = 38; vy = -0.4; glow = true; }
  else if(th === 'desert'){ palette = ['#ffcc80','#ffddaa','#e0a858']; count = 36; vxRange = 0.8; }
  else if(th === 'snow'){ palette = ['#ffffff','#e0f0ff']; count = 30; }
  else if(th === 'volcano'){ palette = ['#ff7043','#ffb74d']; count = 34; vy = -0.5; glow = true; }
  for(let i=0;i<count;i++){
    ambients.push({
      x: Math.random() * W, y: Math.random() * H,
      vx: (Math.random() - 0.5) * vxRange,
      vy: vy + (Math.random() - 0.5) * 0.3,
      size: 1 + Math.random() * 2,
      color: palette[Math.floor(Math.random() * palette.length)],
      alpha: 0.3 + Math.random() * 0.5,
      phase: Math.random() * 6.28, glow
    });
  }
}
function updateAmbients(){
  for(const a of ambients){
    a.x += a.vx + Math.sin(timeMs/1000 + a.phase) * 0.2;
    a.y += a.vy;
    if(a.x < -10) a.x = W + 10;
    if(a.x > W + 10) a.x = -10;
    if(a.y < -10) a.y = H + 10;
    if(a.y > H + 10) a.y = -10;
  }
}
function drawAmbients(){
  ctx.save();
  for(const a of ambients){
    const twinkle = 0.7 + 0.3 * Math.sin(timeMs/400 + a.phase);
    ctx.globalAlpha = a.alpha * twinkle;
    ctx.fillStyle = a.color;
    if(a.glow){ ctx.shadowColor = a.color; ctx.shadowBlur = 6; }
    else { ctx.shadowBlur = 0; }
    ctx.beginPath();
    ctx.arc(Math.round(a.x), Math.round(a.y), a.size, 0, 7);
    ctx.fill();
  }
  ctx.restore();
  ctx.shadowBlur = 0;
}

function drawVignette(){
  if(!vignetteCache || vignetteCache.width !== W || vignetteCache.height !== H){
    vignetteCache = document.createElement('canvas');
    vignetteCache.width = W;
    vignetteCache.height = H;
    const vctx = vignetteCache.getContext('2d');
    const vg = vctx.createRadialGradient(W/2, H/2, Math.min(W,H)*0.35,
                                          W/2, H/2, Math.max(W,H)*0.75);
    vg.addColorStop(0, 'rgba(0,0,0,0)');
    vg.addColorStop(1, 'rgba(0,0,0,0.30)');
    vctx.fillStyle = vg;
    vctx.fillRect(0, 0, W, H);
  }
  ctx.drawImage(vignetteCache, 0, 0);
}

function buildLevel(n){
  const level = LEVELS[n-1];
  levelCols = level.cols; levelW = levelCols*TILE;
  currentTheme = LEVEL_THEMES[n-1];
  grid = [];
  for(let r=0;r<ROWS;r++) grid.push(new Array(levelCols).fill(0));
  coins=[]; enemies=[]; particles=[]; powerups=[]; hazards=[]; bumps={}; blockItems={};
  if(!level.noGround){
    const inGap = c => level.gaps.some(g => c>=g[0] && c<=g[1]);
    for(let c=0;c<levelCols;c++) if(!inGap(c)){
      for(let r=15;r<ROWS;r++) grid[r][c]=1;
    }
  }
  level.build(makeBuilder());
  flagCol = level.flagCol;
  initAmbients();
}

function collideX(e){
  e.hitWall = false;
  const c1=Math.floor(e.x/TILE), c2=Math.floor((e.x+e.w-1)/TILE);
  const r1=Math.floor(e.y/TILE), r2=Math.floor((e.y+e.h-1)/TILE);
  for(let r=r1;r<=r2;r++) for(let c=c1;c<=c2;c++){
    if(!isSolid(c,r)) continue;
    if(e.vx > 0) e.x = c*TILE - e.w;
    else if(e.vx < 0) e.x = (c+1)*TILE;
    if(!e.isEnemy && !e.isPowerup) e.vx = 0;
    e.hitWall = true; return;
  }
}

function moveY(e, isPlayer){
  e.y += e.vy; e.onGround = false;
  const c1=Math.floor(e.x/TILE), c2=Math.floor((e.x+e.w-1)/TILE);
  const r1=Math.floor(e.y/TILE), r2=Math.floor((e.y+e.h-1)/TILE);
  for(let r=r1;r<=r2;r++) for(let c=c1;c<=c2;c++){
    if(!isSolid(c,r)) continue;
    if(e.vy > 0){ e.y = r*TILE - e.h; e.vy = 0; e.onGround = true; return; }
    else if(e.vy < 0){ e.y = (r+1)*TILE; e.vy = 0; if(isPlayer) hitBlock(c,r); return; }
  }
}

function getCoinGain(){ return hasBonus('doubleCoins') ? 2 : 1; }
function getCoinScore(){ return hasBonus('doubleCoins') ? 200 : 100; }

function hitBlock(c,r){
  const t = grid[r][c];
  const key = r*levelCols+c;
  if(t === 3){
    const item = blockItems[key] || 'coin';
    grid[r][c] = 4; bumps[key] = 10;
    if(item === 'coin'){
      addScore(200); coinCount += getCoinGain();
      particles.push({ x:c*TILE+16, y:r*TILE+4, vx:0, vy:-7, life:34, max:34,
                       col:'#ffd54f', size:12, coin:true });
      beep(900, 0.09, 'square', 0.055, 1500);
    } else {
      spawnPowerup(c, r, item);
      beep(420, 0.15, 'square', 0.06, 720);
    }
  }
  else if(t === 2){
    if(p.big){
      grid[r][c] = 0; addScore(50);
      for(let i=0;i<12;i++) particles.push({
        x:c*TILE+6+Math.random()*20, y:r*TILE+6+Math.random()*20,
        vx:(Math.random()-0.5)*8, vy:-Math.random()*8-1,
        life:44, max:44, col: i%2 ? '#c2542a' : '#8c3216', size:7
      });
      beep(240, 0.13, 'square', 0.05, 70);
    } else {
      bumps[key] = 6; beep(180, 0.08, 'square', 0.04);
      for(let i=0;i<3;i++) particles.push({
        x:c*TILE+8+Math.random()*16, y:r*TILE+TILE-4,
        vx:(Math.random()-0.5)*3, vy:-Math.random()*2-1,
        life:16, max:16, col:'#a08870', size:3
      });
    }
  }
  else if(t === 4){ bumps[key] = 6; beep(220, 0.05, 'square', 0.03); }
}

function addScore(n){ score += n; }

function spawnPowerup(c, r, type){
  let speed = 1.6; if(type === '1up') speed = 1.0;
  powerups.push({
    x: c*TILE + (TILE-24)/2, y: r*TILE, w:24, h:24,
    vx: speed, vy:0, type, emerge: 42,
    onGround:false, alive:true, isPowerup:true, t:0
  });
}

function collectPowerup(pu){
  pu.alive = false;
  if(pu.type === 'mushroom'){
    if(!p.big){
      setPlayerSize(true);
      for(let i=0;i<14;i++) particles.push({
        x:p.x+p.w/2, y:p.y+p.h/2,
        vx:(Math.random()-0.5)*7, vy:-Math.random()*5-1,
        life:30, max:30, col: i%2 ? '#ff5252' : '#ffeb3b', size:5
      });
    }
    addScore(1000); beep(880,0.15,'square',0.06,1320);
  }
  else if(pu.type === 'star'){ p.starTimer = 8*60; addScore(1000); beep(1200,0.3,'square',0.06,1800); }
  else if(pu.type === '1up'){ lives++; beep(660,0.1,'square',0.05); setTimeout(()=>beep(990,0.15,'square',0.05),100); }
}

function setPlayerSize(big){
  const oldH = p.h, oldW = p.w; p.big = big;
  const newW = big ? 30 : 22, newH = big ? 44 : 32;
  const cx = p.x + oldW/2;
  p.x = cx - newW/2; p.y = p.y + oldH - newH;
  p.w = newW; p.h = newH;
}

function updatePowerups(){
  for(const pu of powerups){
    if(!pu.alive) continue;
    pu.t++;
    if(pu.emerge > 0){ const step = Math.min(pu.emerge, 1.1); pu.emerge -= step; pu.y -= step; continue; }
    pu.vy += GRAV; if(pu.vy > MAX_FALL) pu.vy = MAX_FALL;
    pu.x += pu.vx;
    const c1=Math.floor(pu.x/TILE), c2=Math.floor((pu.x+pu.w-1)/TILE);
    const r1=Math.floor(pu.y/TILE), r2=Math.floor((pu.y+pu.h-1)/TILE);
    let hitW = false;
    for(let r=r1;r<=r2;r++) for(let c=c1;c<=c2;c++){
      if(isSolid(c,r)){
        if(pu.vx > 0) pu.x = c*TILE - pu.w;
        else if(pu.vx < 0) pu.x = (c+1)*TILE;
        hitW = true;
      }
    }
    if(hitW) pu.vx *= -1;
    pu.y += pu.vy; pu.onGround = false;
    const c3=Math.floor(pu.x/TILE), c4=Math.floor((pu.x+pu.w-1)/TILE);
    const r3=Math.floor(pu.y/TILE), r4=Math.floor((pu.y+pu.h-1)/TILE);
    for(let r=r3;r<=r4;r++) for(let c=c3;c<=c4;c++){
      if(isSolid(c,r)){
        if(pu.vy > 0){ pu.y = r*TILE - pu.h; pu.vy = 0; pu.onGround = true; }
        else if(pu.vy < 0){ pu.y = (r+1)*TILE; pu.vy = 0; }
      }
    }
    if(pu.type === 'star' && pu.onGround) pu.vy = -11;
    if(pu.y > H + 300) pu.alive = false;
    if(pu.alive && aabb(p, pu)) collectPowerup(pu);
  }
  powerups = powerups.filter(x => x.alive);
}

function updateHazards(){
  for(const h of hazards){
    h.t += 0.04;
    h.y += h.vy;
    if(h.y <= h.minY){ h.y = h.minY; h.vy = Math.abs(h.vy); }
    if(h.y >= h.maxY){ h.y = h.maxY; h.vy = -Math.abs(h.vy); }
    const dx = (p.x + p.w/2) - h.x;
    const dy = (p.y + p.h/2) - h.y;
    const rr = h.r + Math.max(p.w, p.h)*0.45;
    if(dx*dx + dy*dy < rr*rr){
      if(p.starTimer > 0){ }
      else hitPlayer();
    }
  }
}

function hitPlayer(){
  if(p.starTimer > 0 || p.invulnTimer > 0) return;
  if(p.big){
    setPlayerSize(false);
    p.invulnTimer = 90;
    beep(300,0.2,'square',0.06,150);
    for(let i=0;i<10;i++) particles.push({
      x:p.x+p.w/2, y:p.y+p.h/2,
      vx:(Math.random()-0.5)*6, vy:-Math.random()*4-1,
      life:24, max:24, col:'#ffeb3b', size:4
    });
  }
  else die();
}

function updatePlayer(){
  if(!p.alive) return;
  if(p.starTimer > 0)   p.starTimer--;
  if(p.invulnTimer > 0) p.invulnTimer--;

  const left  = keys['ArrowLeft'] || keys['KeyA'];
  const right = keys['ArrowRight']|| keys['KeyD'];
  const run   = keys['ShiftLeft'] || keys['ShiftRight'];
  const jk    = JUMP_KEYS.some(k => keys[k]);
  const maxSpd = run ? RUN_MAX : MAX_SPEED;
  const acc    = p.onGround ? MOVE_ACC : MOVE_ACC*0.75;

  if(left && !right){ const b = (p.vx>0)?TURN_BOOST:1; p.vx -= acc*b; p.facing=-1; }
  else if(right && !left){ const b = (p.vx<0)?TURN_BOOST:1; p.vx += acc*b; p.facing=1; }
  else { p.vx *= p.onGround ? FRICTION : AIR_FRIC; if(Math.abs(p.vx)<0.08) p.vx=0; }
  if(Math.abs(p.vx) > maxSpd){
    p.vx += (Math.sign(p.vx)*maxSpd - p.vx)*0.35;
    if(Math.abs(p.vx) > maxSpd*1.15) p.vx = Math.sign(p.vx)*maxSpd;
  }

  if(jk && !p.jumpHeld && (p.onGround || p.coyote > 0)){
    p.vy = JUMP_VEL; p.onGround=false; p.coyote=0; p.jumpHeld=true;
    beep(420,0.11,'square',0.05,780);
  }
  if(!jk){ p.jumpHeld = false; if(p.vy < -6) p.vy = -6; }
  p.vy += GRAV; if(p.vy > MAX_FALL) p.vy = MAX_FALL;

  p.x += p.vx; collideX(p); moveY(p, true);
  if(p.onGround) p.coyote = 8; else if(p.coyote>0) p.coyote--;

  if(Math.abs(p.vx)>0.3 && p.onGround) p.anim += Math.abs(p.vx)*0.07;
  else if(p.onGround) p.anim = 0;

  if(p.x < 0){ p.x = 0; p.vx = 0; }
  if(p.y > H + 200){ die(); return; }

  const pc1 = Math.floor(p.x/TILE), pc2 = Math.floor((p.x+p.w-1)/TILE);
  const pr1 = Math.floor(p.y/TILE), pr2 = Math.floor((p.y+p.h-1)/TILE);
  for(let r=pr1;r<=pr2;r++) for(let c=pc1;c<=pc2;c++){
    if(c<0 || c>=levelCols || r<0 || r>=ROWS) continue;
    if(grid[r][c] === 6 || grid[r][c] === 7){ hitPlayer(); if(!p.alive) return; }
  }

  for(const c of coins){
    if(c.taken) continue;
    if(aabb(p, {x:c.x-10, y:c.y-12, w:20, h:24})){
      c.taken = true;
      coinCount += getCoinGain();
      addScore(getCoinScore());
      beep(1050,0.07,'square',0.05,1600);
      for(let i=0;i<6;i++) particles.push({
        x:c.x, y:c.y, vx:(Math.random()-0.5)*5, vy:-Math.random()*4-1,
        life:22, max:22, col:'#ffe082', size:4 });
    }
  }

  for(const e of enemies){
    if(!e.alive || !e.active) continue;
    if(!aabb(p, e)) continue;
    if(p.starTimer > 0){
      e.alive=false; e.squash=26; addScore(200);
      beep(400,0.1,'square',0.05,200); continue;
    }
    const stomping = p.vy > 0 && (p.y + p.h) < e.y + e.h*0.7;
    if(stomping){
      e.alive=false; e.squash=26; p.vy=-10.5; p.jumpHeld=true; addScore(100);
      beep(300,0.1,'square',0.05,120);
    } else { hitPlayer(); if(!p.alive) return; }
  }

  if(p.x + p.w > flagCol*TILE + 6) reachFlag();
}

function updateEnemies(){
  for(const e of enemies){
    if(e.remove) continue;
    if(!e.alive){ e.squash--; if(e.squash<=0) e.remove=true; continue; }
    if(!e.active){
      if(e.x < camera.x + W + 100) e.active = true;
      else continue;
    }
    if(e.kind === 'bird'){
      e.phase += 0.06;
      e.x += e.dir * e.speed;
      e.y = e.baseY + Math.sin(e.phase) * e.amp;
      if(e.dir < 0 && e.x < camera.x - 150){ e.x = camera.x + W + 80; }
      else if(e.dir > 0 && e.x > camera.x + W + 150){ e.x = camera.x - 80; }
    }
    else if(e.kind === 'spider'){
      e.phase += 0.04 * e.speed;
      e.y = e.baseY + (Math.sin(e.phase) * 0.5 + 0.5) * e.amp;
    }
    else if(e.kind === 'jumper'){
      e.vy += GRAV; if(e.vy > MAX_FALL) e.vy = MAX_FALL;
      e.vx = e.dir * e.speed;
      e.x += e.vx; collideX(e);
      if(e.hitWall) e.dir *= -1;
      moveY(e, false);
      if(e.onGround){
        e.jumpTimer--;
        if(e.jumpTimer <= 0){
          e.vy = -12;
          e.jumpTimer = 80 + Math.random()*40;
        }
      }
      if(e.y > H + 300){ e.alive=false; e.squash=0; e.remove=true; }
    }
    else if(e.kind === 'fireball'){
      e.phase += 0.06 * e.speed;
      e.y = e.baseY + Math.sin(e.phase) * e.amp;
    }
    else {
      e.vy += GRAV; if(e.vy > MAX_FALL) e.vy = MAX_FALL;
      e.vx = e.dir * e.speed;
      e.x += e.vx; collideX(e);
      if(e.hitWall) e.dir *= -1;
      moveY(e, false);
      if(e.y > H + 300){ e.alive=false; e.squash=0; e.remove=true; }
    }
  }
  enemies = enemies.filter(e => !e.remove);
}

function updateParticles(){
  for(const pt of particles){
    pt.x += pt.vx; pt.y += pt.vy;
    if(!pt.coin) pt.vy += 0.45; else { pt.vy += 0.35; pt.vx = 0; }
    pt.life--;
  }
  particles = particles.filter(pt => pt.life > 0);
  for(const k in bumps){ bumps[k]--; if(bumps[k] <= 0) delete bumps[k]; }
}

function updateCamera(){
  const target = p.x + p.w/2 - W/2;
  camera.x += (target - camera.x) * 0.12;
  camera.x = Math.max(0, Math.min(levelW - W, camera.x));
}

function die(){
  if(!p.alive) return;
  p.alive=false; p.vy=-11; p.vx=0;
  state='dead'; stateTimer=0;
  beep(500,0.5,'square',0.06,90);
}

function reachFlag(){
  if(state !== 'playing') return;
  addScore(2000 + currentLevel*500);
  state='levelclear'; stateTimer=0;
  beep(660,0.1);
  setTimeout(()=>beep(880,0.1),100);
  setTimeout(()=>beep(1100,0.15),200);
  if(gameMode === 'campaign'){
    const nextCp = CHECKPOINTS.find(cp => cp === currentLevel + 1);
    if(nextCp && save.checkpoint < nextCp){ save.checkpoint = nextCp; writeSave(); }
  }
}

function win(){
  state='win'; stateTimer=0;
  save.wallet += coinCount;
  if(gameMode === 'campaign' && save.checkpoint < TOTAL_LEVELS){
    save.checkpoint = TOTAL_LEVELS; writeSave();
  }
  const notes = [523,659,784,1046,1318];
  notes.forEach((f,i) => setTimeout(()=>beep(f,0.16,'square',0.055), i*110));
}

function clearKeys(){
  for(const k in keys) keys[k] = false;
  activeTouches.clear();
}

function startLevel(col){
  buildLevel(currentLevel);
  clearKeys();
  if(currentLevel > save.unlockedLevels){ save.unlockedLevels = currentLevel; writeSave(); }
  if(hasBonus('bigStart')){ p.w = 30; p.h = 44; p.big = true; }
  else { p.w = 22; p.h = 32; p.big = false; }
  p.x = col*TILE;
  let spawnRow = 15;
  for(let r=3; r<ROWS; r++){
    if(isSolid(col, r) || isSolid(col+1, r)){ spawnRow = r; break; }
  }
  p.y = spawnRow*TILE - p.h;
  p.vx=0; p.vy=0; p.alive=true; p.onGround=false; p.facing=1;
  p.jumpHeld=false; p.coyote=0; p.anim=0;
  p.starTimer = hasBonus('starStart') ? 5*60 : 0;
  p.invulnTimer=0;
  camera.x = Math.max(0, Math.min(levelW - W, p.x - W/2));
  state='playing';
}

function startGame(mode, level){
  gameMode = mode;
  score=0; coinCount=0; spawnCol=3;
  lives = hasBonus('extraLife') ? 4 : 3;
  currentLevel = level;
  if(level > save.unlockedLevels){ save.unlockedLevels = level; writeSave(); }
  startLevel(3);
  beep(660,0.1,'square',0.05,990);
}

// ============== TOUCH CONTROLS ==============
const activeTouches = new Map(); // identifier -> button name

function getTouchButtons(){
  return {
    left:  { x: 40,         y: H - 190, w: 120, h: 120, label:'◀' },
    right: { x: 180,        y: H - 190, w: 120, h: 120, label:'▶' },
    run:   { x: W - 400,    y: H - 165, w: 110, h: 110, label:'RUN' },
    jump:  { x: W - 260,    y: H - 195, w: 140, h: 140, label:'⤒' },
    pause: { x: W - 78,     y: 20,      w: 58,  h: 58,  label:'❚❚' }
  };
}
const touchKeyMap = {
  left:  'ArrowLeft',
  right: 'ArrowRight',
  run:   'ShiftLeft',
  jump:  'Space'
};

function getCanvasPos(t){
  const r = canvas.getBoundingClientRect();
  return {
    x: (t.clientX - r.left) * (canvas.width / r.width),
    y: (t.clientY - r.top)  * (canvas.height / r.height)
  };
}
function pointInBtn(p, b){
  return p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h;
}

canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  const btns = getTouchButtons();

  for(const t of e.changedTouches){
    const pos = getCanvasPos(t);

    // Menu tap
    if(state === 'menu'){
      handleMenuTap(pos.x, pos.y);
      continue;
    }

    // Pause button — dostupan u svim fazama igre
    if((state === 'playing' || state === 'paused' || state === 'dead' || state === 'levelclear') && pointInBtn(pos, btns.pause)){
      activeTouches.set(t.identifier, 'pause');
      if(state === 'playing'){
        state = 'paused';
        clearKeys();
        beep(400,0.1,'square',0.05,300);
      } else if(state === 'paused'){
        state = 'playing';
        beep(600,0.1,'square',0.05,800);
      }
      continue;
    }

    // Game buttons
    if(state === 'playing' || state === 'paused'){
      let hit = null;
      for(const name of ['left','right','run','jump']){
        if(pointInBtn(pos, btns[name])){ hit = name; break; }
      }
      if(hit){
        activeTouches.set(t.identifier, hit);
        keys[touchKeyMap[hit]] = true;
      }
      continue;
    }

    // Overlays — bilo gdje za potvrdu
    if(state === 'gameover'){
      if(gameMode === 'hardcore'){ startGame('hardcore', 1); }
      else if(gameMode === 'freeplay'){ state = 'menu'; menuScreen = 'levels'; levelCursor = 0; }
      else { const startLvl = Math.min(save.checkpoint, LAST_CHECKPOINT); startGame('campaign', startLvl); }
      continue;
    }
    if(state === 'win'){
      state = 'menu'; menuScreen = 'main'; menuCursor = 0;
      continue;
    }
    if(state === 'dead'){
      // Ne radi ništa — čekaj animaciju
      continue;
    }
  }
}, {passive:false});

canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  const btns = getTouchButtons();
  for(const t of e.changedTouches){
    const cur = activeTouches.get(t.identifier);
    if(!cur || cur === 'pause') continue;
    const pos = getCanvasPos(t);
    const stillOn = pointInBtn(pos, btns[cur]);
    if(!stillOn){
      keys[touchKeyMap[cur]] = false;
      activeTouches.delete(t.identifier);
    }
  }
}, {passive:false});

function endTouch(e){
  e.preventDefault();
  for(const t of e.changedTouches){
    const cur = activeTouches.get(t.identifier);
    if(cur && cur !== 'pause'){ keys[touchKeyMap[cur]] = false; }
    activeTouches.delete(t.identifier);
  }
}
canvas.addEventListener('touchend', endTouch, {passive:false});
canvas.addEventListener('touchcancel', endTouch, {passive:false});

// Desni klik ne otvara kontekstni meni
canvas.addEventListener('contextmenu', e => e.preventDefault());

// ============== MENU TAP ==============
function handleMenuTap(x, y){
  if(menuScreen === 'main'){
    const startY = 170, rowH = 52;
    for(let i=0;i<MAIN_MENU.length;i++){
      const itemY = startY + i*rowH;
      if(y > itemY - rowH/2 && y < itemY + rowH/2 && x > W/2 - 80 && x < W/2 + 500){
        menuCursor = i;
        handleMenuInput({ code:'Enter', preventDefault:()=>{} });
        return;
      }
    }
  }
  else if(menuScreen === 'levels'){
    const half = Math.ceil(TOTAL_LEVELS / 2);
    const startY = 130, rowH = 44;
    const leftX = W/2 - 420, rightX = W/2 + 40;
    for(let i=0;i<TOTAL_LEVELS;i++){
      const col = i < half ? 0 : 1;
      const row = i < half ? i : i - half;
      const ix = (col === 0 ? leftX : rightX);
      const iy = startY + row*rowH;
      if(y > iy - rowH/2 && y < iy + rowH/2 && x > ix - 20 && x < ix + 380){
        levelCursor = i;
        handleMenuInput({ code:'Enter', preventDefault:()=>{} });
        return;
      }
    }
    // ESC područje — tap izvan liste
    if(y > H - 60){ menuScreen = 'main'; menuCursor = 2; }
  }
  else if(menuScreen === 'chars'){
    // Tap lijevo/desno/strelice
    const n = save.owned.length;
    if(x < W/2 - 200 && menuCursor > 0){ menuCursor--; beep(500,0.05,'square',0.03); return; }
    if(x > W/2 + 200 && menuCursor < n-1){ menuCursor++; beep(500,0.05,'square',0.03); return; }
    // Tap na veliki avatar — potvrdi
    if(x > W/2 - 200 && x < W/2 + 200 && y > 100 && y < H - 100){
      handleMenuInput({ code:'Enter', preventDefault:()=>{} });
      return;
    }
    if(y > H - 60){ menuScreen = 'main'; menuCursor = 3; }
  }
  else if(menuScreen === 'shop'){
    // Tabovi gore
    const tabY = 100, tabW = 200, tabH = 38;
    const totalW = tabW*2 + 16, startX = W/2 - totalW/2;
    if(y > tabY && y < tabY + tabH){
      if(x > startX && x < startX + tabW){ shopTab = 'chars'; menuCursor = 0; beep(600,0.06,'square',0.04); return; }
      if(x > startX + tabW + 16 && x < startX + tabW*2 + 16){ shopTab = 'bonus'; menuCursor = 0; beep(600,0.06,'square',0.04); return; }
    }
    if(shopTab === 'chars'){
      const baseY = 580, spacing = 70;
      const totalW2 = (CHARACTERS.length - 1) * spacing;
      for(let i=0;i<CHARACTERS.length;i++){
        const cx = W/2 - totalW2/2 + i*spacing;
        if(Math.abs(x - cx) < 30 && y > baseY - 40 && y < baseY + 30){
          menuCursor = i;
          handleMenuInput({ code:'Enter', preventDefault:()=>{} });
          return;
        }
      }
    } else {
      const baseY = 555, spacing = 150;
      const totalW2 = (BONUSES.length - 1) * spacing;
      for(let i=0;i<BONUSES.length;i++){
        const cx = W/2 - totalW2/2 + i*spacing;
        if(Math.abs(x - cx) < 55 && y > baseY - 42 && y < baseY + 46){
          menuCursor = i;
          handleMenuInput({ code:'Enter', preventDefault:()=>{} });
          return;
        }
      }
    }
    if(y > H - 60){ menuScreen = 'main'; menuCursor = 4; }
  }
  else if(menuScreen === 'controls'){
    const startY = 300, rowH = 80;
    for(let i=0;i<3;i++){
      const iy = startY + i*rowH;
      if(y > iy - rowH/2 && y < iy + rowH/2 && x > W/2 - 320 && x < W/2 + 320){
        menuCursor = i;
        handleMenuInput({ code:'Enter', preventDefault:()=>{} });
        return;
      }
    }
    if(y > H - 60){ menuScreen = 'main'; menuCursor = 5; }
  }
  else if(menuScreen === 'help'){
    if(y > H - 60 || x < 60 || x > W - 60){ menuScreen = 'main'; menuCursor = 6; }
  }
}

// ============== RENDER TOUCH BUTTONS ==============
function drawTouchControls(){
  if(!isMobileMode()) return;
  if(state === 'menu') return;
  if(state === 'levelclear' || state === 'win' || state === 'gameover') return;

  const btns = getTouchButtons();
  ctx.save();

  const drawBtn = (b, active, big) => {
    const r = 20;
    // Sjenka
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.beginPath();
    if(ctx.roundRect) ctx.roundRect(b.x + 3, b.y + 3, b.w, b.h, r);
    else ctx.rect(b.x + 3, b.y + 3, b.w, b.h);
    ctx.fill();
    // Tijelo
    ctx.fillStyle = active ? 'rgba(255,213,79,0.75)' : 'rgba(20,30,50,0.55)';
    ctx.beginPath();
    if(ctx.roundRect) ctx.roundRect(b.x, b.y, b.w, b.h, r);
    else ctx.rect(b.x, b.y, b.w, b.h);
    ctx.fill();
    // Obrub
    ctx.strokeStyle = active ? '#ffffff' : 'rgba(255,255,255,0.45)';
    ctx.lineWidth = active ? 4 : 2.5;
    ctx.stroke();
    // Tekst
    ctx.fillStyle = active ? '#000' : 'rgba(255,255,255,0.9)';
    ctx.font = `bold ${big ? 44 : 36}px system-ui,monospace`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(b.label, b.x + b.w/2, b.y + b.h/2 + 2);
  };

  for(const name of ['left','right','run','jump']){
    const b = btns[name];
    const active = Array.from(activeTouches.values()).includes(name) || keys[touchKeyMap[name]];
    drawBtn(b, active, name === 'jump');
  }

  // Pause button (manji, u kutu)
  const pb = btns.pause;
  const pauseActive = activeTouches.get(-1) === 'pause' || state === 'paused';
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.beginPath();
  if(ctx.roundRect) ctx.roundRect(pb.x + 2, pb.y + 2, pb.w, pb.h, 14);
  else ctx.rect(pb.x + 2, pb.y + 2, pb.w, pb.h);
  ctx.fill();
  ctx.fillStyle = pauseActive ? 'rgba(255,213,79,0.85)' : 'rgba(20,30,50,0.6)';
  ctx.beginPath();
  if(ctx.roundRect) ctx.roundRect(pb.x, pb.y, pb.w, pb.h, 14);
  else ctx.rect(pb.x, pb.y, pb.w, pb.h);
  ctx.fill();
  ctx.strokeStyle = pauseActive ? '#fff' : 'rgba(255,255,255,0.5)';
  ctx.lineWidth = 2.5;
  ctx.stroke();
  ctx.fillStyle = pauseActive ? '#000' : 'rgba(255,255,255,0.9)';
  ctx.font = 'bold 22px system-ui,monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(pb.label, pb.x + pb.w/2, pb.y + pb.h/2 + 1);

  ctx.restore();
}

// ============== POZADINA ==============
function drawCloud(x,y,s,col){
  ctx.fillStyle = 'rgba(180,210,240,0.55)';
  ctx.beginPath(); ctx.arc(x+2, y+4, 20*s, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(x+26*s, y-9*s, 26*s, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(x+54*s, y+4, 20*s, 0, 7); ctx.fill();
  ctx.fillRect(x+2, y, 52*s, 22*s);
  ctx.fillStyle = col;
  ctx.beginPath(); ctx.arc(x, y, 20*s, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(x+24*s, y-13*s, 26*s, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(x+52*s, y, 20*s, 0, 7); ctx.fill();
  ctx.fillRect(x, y-4*s, 52*s, 20*s);
  ctx.fillStyle = 'rgba(255,255,255,0.7)';
  ctx.beginPath(); ctx.arc(x+16*s, y-16*s, 8*s, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(x+34*s, y-13*s, 7*s, 0, 7); ctx.fill();
}
function drawHill(x, base, w, h, col, col2){
  ctx.fillStyle = col;
  ctx.beginPath(); ctx.moveTo(x, base);
  ctx.quadraticCurveTo(x+w/2, base-h*2, x+w, base); ctx.closePath(); ctx.fill();
  ctx.fillStyle = col2;
  ctx.beginPath(); ctx.moveTo(x+w*0.18, base);
  ctx.quadraticCurveTo(x+w/2, base-h*1.5, x+w*0.72, base); ctx.closePath(); ctx.fill();
  ctx.globalAlpha = 0.3; ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.moveTo(x+w*0.42, base-h*1.7);
  ctx.quadraticCurveTo(x+w*0.5, base-h*1.85, x+w*0.58, base-h*1.7);
  ctx.lineTo(x+w*0.52, base-h*1.55); ctx.lineTo(x+w*0.48, base-h*1.55);
  ctx.closePath(); ctx.fill();
  ctx.globalAlpha = 1;
}
function drawMountain(x, base, w, h, col, col2){
  ctx.fillStyle = col;
  ctx.beginPath(); ctx.moveTo(x, base); ctx.lineTo(x+w*0.5, base-h); ctx.lineTo(x+w, base); ctx.closePath(); ctx.fill();
  ctx.fillStyle = col2;
  ctx.beginPath(); ctx.moveTo(x+w*0.35, base); ctx.lineTo(x+w*0.5, base-h); ctx.lineTo(x+w*0.65, base); ctx.closePath(); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  ctx.beginPath(); ctx.moveTo(x+w*0.44, base-h*0.85);
  ctx.lineTo(x+w*0.5, base-h); ctx.lineTo(x+w*0.56, base-h*0.85);
  ctx.closePath(); ctx.fill();
}
function drawTower(x, base, w, h, col, accent){
  ctx.fillStyle = col; ctx.fillRect(x, base-h, w, h);
  ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fillRect(x+w*0.7, base-h, w*0.3, h);
  const mw = w/5;
  for(let i=0;i<3;i++) ctx.fillRect(x + i*mw*2, base-h-14, mw, 14);
  ctx.fillStyle = accent;
  ctx.fillRect(x+w/2-4, base-h*0.7, 8, 12);
  ctx.fillRect(x+w/2-4, base-h*0.45, 8, 12);
  ctx.fillStyle = 'rgba(255,220,120,0.5)';
  ctx.fillRect(x+w/2-3, base-h*0.7+2, 6, 4);
}
function drawTree(x, base, h, trunk, leaf1, leaf2){
  ctx.fillStyle = trunk; ctx.fillRect(x+10, base-h*0.4, 12, h*0.4);
  ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.fillRect(x+18, base-h*0.4, 4, h*0.4);
  ctx.fillStyle = leaf1;
  ctx.beginPath(); ctx.arc(x+16, base-h*0.55, 30, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(x-6, base-h*0.45, 22, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(x+38, base-h*0.45, 22, 0, 7); ctx.fill();
  ctx.fillStyle = leaf2;
  ctx.beginPath(); ctx.arc(x+16, base-h*0.7, 22, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(x+4, base-h*0.62, 14, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(x+28, base-h*0.62, 14, 0, 7); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.18)';
  ctx.beginPath(); ctx.arc(x+10, base-h*0.75, 10, 0, 7); ctx.fill();
}
function drawTorch(x, y){
  ctx.fillStyle = '#3a2818'; ctx.fillRect(x-2, y, 4, 14);
  const f = Math.sin(timeMs/120 + x)*0.4 + 0.6;
  ctx.fillStyle = `rgba(255,80,20,${0.15*f})`;
  ctx.beginPath(); ctx.arc(x, y-4, 14, 0, 7); ctx.fill();
  ctx.fillStyle = `rgba(255,150,30,${f})`;
  ctx.beginPath(); ctx.arc(x, y-4, 7, 0, 7); ctx.fill();
  ctx.fillStyle = `rgba(255,220,80,${f})`;
  ctx.beginPath(); ctx.arc(x, y-4, 4, 0, 7); ctx.fill();
  ctx.fillStyle = `rgba(255,255,220,${f*0.8})`;
  ctx.beginPath(); ctx.arc(x, y-5, 2, 0, 7); ctx.fill();
}
function drawPyramid(x, base, w, h){
  ctx.fillStyle = '#c48a3a';
  ctx.beginPath(); ctx.moveTo(x, base); ctx.lineTo(x+w*0.5, base-h); ctx.lineTo(x+w, base); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#a07030';
  ctx.beginPath(); ctx.moveTo(x+w*0.25, base); ctx.lineTo(x+w*0.5, base-h); ctx.lineTo(x+w*0.75, base); ctx.closePath(); ctx.fill();
  ctx.fillStyle = 'rgba(255,220,150,0.35)';
  ctx.beginPath(); ctx.moveTo(x+w*0.5, base-h); ctx.lineTo(x+w*0.75, base);
  ctx.lineTo(x+w*0.68, base); ctx.lineTo(x+w*0.5, base-h); ctx.closePath(); ctx.fill();
}
function drawPine(x, base, h){
  ctx.fillStyle = '#3a2818'; ctx.fillRect(x+12, base-20, 8, 20);
  ctx.fillStyle = '#1e4028';
  ctx.beginPath(); ctx.moveTo(x-10, base-20); ctx.lineTo(x+16, base-h); ctx.lineTo(x+42, base-20); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#2a5030';
  ctx.beginPath(); ctx.moveTo(x-2, base-40); ctx.lineTo(x+16, base-h-20); ctx.lineTo(x+34, base-40); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#ffffff';
  ctx.beginPath(); ctx.moveTo(x+6, base-h+5); ctx.lineTo(x+16, base-h-3); ctx.lineTo(x+26, base-h+5); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(x+8, base-42); ctx.lineTo(x+16, base-h-22); ctx.lineTo(x+24, base-42); ctx.closePath(); ctx.fill();
}

function drawBackground(){
  const th = currentTheme || LEVEL_THEMES[0];
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0, th.sky[0]); g.addColorStop(0.45, th.sky[1]);
  g.addColorStop(0.8, th.sky[2]); g.addColorStop(1, th.sky[3]);
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
  const hy = H - 40;

  if(th.bg === 'hills'){
    for(let i=0;i<30;i++){ const x = i*420 - camera.x*0.35; if(x<-500||x>W+500) continue;
      drawHill(x, hy, 300, 130, th.hills[0][0], th.hills[0][1]); }
    for(let i=0;i<30;i++){ const x = i*330 + 180 - camera.x*0.55; if(x<-400||x>W+400) continue;
      drawHill(x, hy, 220, 90, th.hills[1][0], th.hills[1][1]); }
    if(th.clouds) for(let i=0;i<40;i++){
      const x = i*380 + 60 - camera.x*0.2; if(x<-300||x>W+300) continue;
      drawCloud(x, 70 + (i%3)*55, 0.7 + (i%3)*0.16, th.cloudCol); }
  }
  else if(th.bg === 'mountains'){
    const sunX = W*0.75 - camera.x*0.05;
    if(sunX > -100 && sunX < W + 100){
      ctx.save(); ctx.shadowColor = th.sunCol; ctx.shadowBlur = 80;
      ctx.fillStyle = th.sunCol;
      ctx.beginPath(); ctx.arc(sunX, 140, 55, 0, 7); ctx.fill();
      ctx.restore();
    }
    for(let i=0;i<26;i++){ const x = i*280 - camera.x*0.25; if(x<-400||x>W+400) continue;
      drawMountain(x, hy, 260, 200, th.hills[0][0], th.hills[0][1]); }
    for(let i=0;i<26;i++){ const x = i*220 + 100 - camera.x*0.45; if(x<-350||x>W+350) continue;
      drawMountain(x, hy, 200, 150, th.hills[1][0], th.hills[1][1]); }
  }
  else if(th.bg === 'forest'){
    for(let i=0;i<32;i++){
      const x = i*260 - camera.x*0.3; if(x<-200||x>W+200) continue;
      drawTree(x, hy+10, 260, '#1a1005', '#0d2010', '#153018');
    }
    for(let i=0;i<32;i++){
      const x = i*180 + 60 - camera.x*0.55; if(x<-200||x>W+200) continue;
      drawTree(x, hy+20, 320, '#2a1a08', '#153018', '#1e4028');
    }
    ctx.save(); ctx.globalAlpha = 0.08; ctx.fillStyle = '#ffee88';
    for(let i=0;i<10;i++){
      const x = i*180 - (camera.x*0.15) % 180;
      ctx.beginPath();
      ctx.moveTo(x, 0); ctx.lineTo(x+80, 0); ctx.lineTo(x+180, H); ctx.lineTo(x-100, H);
      ctx.closePath(); ctx.fill();
    }
    ctx.restore();
  }
  else if(th.bg === 'sky'){
    ctx.save(); ctx.shadowColor = '#fff59d'; ctx.shadowBlur = 80;
    ctx.fillStyle = '#fff59d';
    ctx.beginPath(); ctx.arc(W*0.15, 90, 45, 0, 7); ctx.fill();
    ctx.restore();
    const rx = W*0.6 - camera.x*0.1;
    if(rx > -400 && rx < W+400){
      const colors = ['#ff5252','#ff9800','#ffeb3b','#66bb6a','#42a5f5','#7e57c2'];
      for(let i=0;i<colors.length;i++){
        ctx.strokeStyle = colors[i]; ctx.globalAlpha = 0.35; ctx.lineWidth = 10;
        ctx.beginPath(); ctx.arc(rx, hy, 300 - i*10, Math.PI, 0); ctx.stroke();
      }
      ctx.globalAlpha = 1;
    }
    for(let i=0;i<45;i++){
      const x = i*320 + ((i*37)%120) - camera.x*0.15;
      if(x<-300||x>W+300) continue;
      const s = 0.55 + (i%4)*0.22;
      const y = 40 + ((i*53)%240);
      ctx.globalAlpha = 0.9;
      drawCloud(x, y, s, '#ffffff');
    }
    ctx.globalAlpha = 1;
    for(let i=0;i<30;i++){
      const x = i*400 + 80 - camera.x*0.35;
      if(x<-350||x>W+350) continue;
      const y = 420 + ((i*29)%140);
      ctx.globalAlpha = 0.55;
      drawCloud(x, y, 1.0, '#ffffff');
    }
    ctx.globalAlpha = 1;
  }
  else if(th.bg === 'dungeon'){
    ctx.fillStyle = '#1a1418'; ctx.fillRect(0, 0, W, H);
    for(let y=0;y<H;y+=40){
      const offset = (Math.floor(y/40)%2) * 40;
      for(let x=-40;x<W+40;x+=80){
        const cx = x + offset - (camera.x*0.2) % 80;
        const isEven = Math.floor((x+y)/80)%3 === 0;
        ctx.fillStyle = isEven ? '#241a20' : '#1e161c';
        ctx.fillRect(cx, y, 76, 36);
        ctx.fillStyle = 'rgba(120,90,90,0.08)';
        ctx.fillRect(cx, y, 76, 2);
        ctx.strokeStyle = '#100a10'; ctx.lineWidth = 2;
        ctx.strokeRect(cx, y, 76, 36);
      }
    }
    for(let i=0;i<18;i++){
      const x = i*260 - camera.x*0.4;
      if(x<-30||x>W+30) continue;
      drawTorch(x, 200); drawTorch(x + 130, 200);
    }
    ctx.strokeStyle = 'rgba(80,60,60,0.6)'; ctx.lineWidth = 1;
    for(let i=0;i<30;i++){
      const x = i*140 - camera.x*0.55;
      if(x<-10||x>W+10) continue;
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x+Math.sin(timeMs/800 + i)*6, 140); ctx.stroke();
    }
  }
  else if(th.bg === 'castle'){
    for(let i=0;i<100;i++){
      const sx = ((i*137)%(W+100)) - 50 - camera.x*0.08;
      const sy = ((i*53)%(H-200)) + 20;
      if(sx>-20 && sx<W+20){
        const tw = 0.5 + 0.5*Math.sin(timeMs/500 + i);
        ctx.fillStyle = `rgba(255,255,255,${0.4 + tw*0.5})`;
        ctx.fillRect(sx, sy, 2, 2);
      }
    }
    const mx = W*0.8 - camera.x*0.05;
    if(mx > -80 && mx < W + 80){
      ctx.fillStyle = 'rgba(255,248,208,0.15)';
      ctx.beginPath(); ctx.arc(mx, 100, 75, 0, 7); ctx.fill();
      ctx.fillStyle = '#fff8d0';
      ctx.beginPath(); ctx.arc(mx, 100, 38, 0, 7); ctx.fill();
      ctx.fillStyle = 'rgba(255,248,208,0.35)';
      ctx.beginPath(); ctx.arc(mx, 100, 55, 0, 7); ctx.fill();
      ctx.fillStyle = 'rgba(200,190,150,0.6)';
      ctx.beginPath(); ctx.arc(mx-10, 92, 5, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.arc(mx+8, 105, 7, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.arc(mx+3, 84, 4, 0, 7); ctx.fill();
    }
    for(let i=0;i<24;i++){ const x = i*340 - camera.x*0.3; if(x<-300||x>W+300) continue;
      drawTower(x, hy+10, 140, 280+(i%3)*40, th.hills[0][0], th.hills[0][1]); }
    for(let i=0;i<24;i++){ const x = i*460 + 200 - camera.x*0.55; if(x<-400||x>W+400) continue;
      drawTower(x, hy+20, 180, 360+(i%2)*60, th.hills[1][0], th.hills[1][1]); }
  }
  else if(th.bg === 'desert'){
    const sunX = W*0.7 - camera.x*0.05;
    if(sunX > -100 && sunX < W+100){
      ctx.save(); ctx.shadowColor = '#fff09b'; ctx.shadowBlur = 100;
      ctx.fillStyle = '#fff09b';
      ctx.beginPath(); ctx.arc(sunX, 130, 55, 0, 7); ctx.fill();
      ctx.restore();
    }
    for(let i=0;i<18;i++){ const x = i*440 - camera.x*0.28; if(x<-400||x>W+400) continue;
      drawPyramid(x, hy, 340, 220); }
    for(let i=0;i<36;i++){
      const x = i*320 + 100 - camera.x*0.55;
      if(x<-300||x>W+300) continue;
      ctx.fillStyle = '#e0a858';
      ctx.beginPath(); ctx.arc(x+160, hy+40, 180, Math.PI, 0); ctx.fill();
      ctx.fillStyle = '#d09040';
      ctx.beginPath(); ctx.arc(x+160, hy+60, 160, Math.PI, 0); ctx.fill();
      ctx.fillStyle = 'rgba(255,220,150,0.25)';
      ctx.beginPath(); ctx.arc(x+100, hy+20, 90, Math.PI, 0); ctx.fill();
    }
  }
  else if(th.bg === 'snow'){
    for(let i=0;i<24;i++){ const x = i*300 - camera.x*0.25; if(x<-300||x>W+300) continue;
      ctx.fillStyle = '#a8b8d8';
      ctx.beginPath(); ctx.moveTo(x, hy); ctx.lineTo(x+150, hy-240); ctx.lineTo(x+300, hy); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.moveTo(x+100, hy-160); ctx.lineTo(x+150, hy-240); ctx.lineTo(x+200, hy-160); ctx.closePath(); ctx.fill();
    }
    for(let i=0;i<24;i++){ const x = i*380 + 200 - camera.x*0.5; if(x<-300||x>W+300) continue;
      ctx.fillStyle = '#d0e0f8';
      ctx.beginPath(); ctx.arc(x+180, hy+20, 220, Math.PI, 0); ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(x+180, hy+10, 200, Math.PI, 0); ctx.fill();
    }
    for(let i=0;i<30;i++){
      const x = i*320 + 80 - camera.x*0.62;
      if(x<-80||x>W+80) continue;
      drawPine(x, hy+15, 130);
    }
    for(let i=0;i<80;i++){
      const fx = ((i*137 + timeMs*0.04) % (W+60)) - 30;
      const fy = ((i*83 + timeMs*0.09) % (H+30)) - 15;
      ctx.fillStyle = `rgba(255,255,255,${0.6 + (i%3)*0.13})`;
      ctx.beginPath(); ctx.arc(Math.round(fx), Math.round(fy), 1.5 + (i%3), 0, 7); ctx.fill();
    }
  }
  else if(th.bg === 'volcano'){
    for(let i=0;i<14;i++){ const x = i*440 - camera.x*0.3; if(x<-400||x>W+400) continue;
      ctx.fillStyle = '#2a1010';
      ctx.beginPath(); ctx.moveTo(x, hy); ctx.lineTo(x+220, hy-300); ctx.lineTo(x+440, hy); ctx.closePath(); ctx.fill();
      ctx.save(); ctx.shadowColor = '#ff4400'; ctx.shadowBlur = 40;
      ctx.fillStyle = '#ff4400';
      ctx.beginPath(); ctx.arc(x+220, hy-300, 32, 0, 7); ctx.fill();
      ctx.restore();
      ctx.fillStyle = '#ffaa00';
      ctx.beginPath(); ctx.arc(x+220, hy-300, 18, 0, 7); ctx.fill();
      ctx.fillStyle = 'rgba(255,100,0,0.75)';
      ctx.beginPath();
      ctx.moveTo(x+195, hy-280); ctx.lineTo(x+245, hy-280);
      ctx.lineTo(x+260, hy-80); ctx.lineTo(x+180, hy-80);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = 'rgba(255,200,0,0.5)';
      ctx.fillRect(x+205, hy-270, 8, 190);
    }
    for(let i=0;i<25;i++){
      const sx = i*260 + 130 - camera.x*0.15;
      const sy = 60 + Math.sin(timeMs/2500 + i)*30;
      if(sx<-100||sx>W+100) continue;
      ctx.fillStyle = `rgba(60,40,40,${0.25 + (i%3)*0.08})`;
      ctx.beginPath(); ctx.arc(sx, sy, 55 + (i%3)*15, 0, 7); ctx.fill();
    }
    for(let i=0;i<60;i++){
      const fx = ((i*137 + timeMs*0.02) % (W+60)) - 30;
      const fy = ((i*53 + timeMs*0.05) % (H+30)) - 15;
      ctx.fillStyle = 'rgba(200,150,100,0.6)';
      ctx.fillRect(Math.round(fx), Math.round(fy), 2, 2);
    }
    const gr = ctx.createLinearGradient(0, H-150, 0, H);
    gr.addColorStop(0, 'rgba(255,80,0,0)');
    gr.addColorStop(1, 'rgba(255,80,0,0.35)');
    ctx.fillStyle = gr;
    ctx.fillRect(0, H-150, W, 150);
  }
}

function drawLava(){
  if(!currentTheme || !currentTheme.lava) return;
  const c0 = Math.max(0, Math.floor(camera.x/TILE) - 1);
  const c1 = Math.min(levelCols-1, Math.floor((camera.x + W)/TILE) + 1);
  for(let c=c0;c<=c1;c++){
    if(isSolid(c,15) || isSolid(c,16) || isSolid(c,14)) continue;
    const x = Math.round(c*TILE - camera.x), y = 15*TILE + 6;
    const lg = ctx.createLinearGradient(0, y, 0, H);
    lg.addColorStop(0, '#ffce3a'); lg.addColorStop(0.3, '#ff6f00'); lg.addColorStop(1, '#5a1000');
    ctx.fillStyle = lg; ctx.fillRect(x, y, TILE, H - y + 40);
    const wave = Math.sin(timeMs/300 + c*0.6) * 3;
    ctx.fillStyle = '#ffeb3b'; ctx.fillRect(x, y + wave, TILE, 3);
    ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.fillRect(x, y + wave, TILE, 1);
  }
}

function drawTile(c, r, t, x, y){
  const th = currentTheme || LEVEL_THEMES[0];
  if(t === 1){
    ctx.fillStyle = th.groundBody[0]; ctx.fillRect(x, y, TILE, TILE);
    if(th.groundStyle === 'grass'){
      ctx.fillStyle = th.groundBody[1];
      ctx.fillRect(x, y, TILE, 2); ctx.fillRect(x, y+16, TILE, 2);
      ctx.fillRect(x+15, y, 2, 16); ctx.fillRect(x+7, y+16, 2, 16); ctx.fillRect(x+23, y+16, 2, 16);
      if(!isSolid(c, r-1)){
        ctx.fillStyle = th.groundTop[0]; ctx.fillRect(x, y, TILE, 9);
        ctx.fillStyle = th.groundTop[1]; ctx.fillRect(x, y, TILE, 4);
        ctx.fillStyle = th.groundTop[2]; ctx.fillRect(x, y+8, TILE, 3);
        ctx.fillStyle = th.groundTop[0];
        ctx.fillRect(x+4, y-2, 2, 3); ctx.fillRect(x+12, y-3, 2, 4); ctx.fillRect(x+22, y-2, 2, 3);
      }
    } else if(th.groundStyle === 'rock'){
      ctx.fillStyle = th.groundBody[1]; ctx.fillRect(x, y, TILE, TILE);
      ctx.fillStyle = th.groundBody[2];
      ctx.fillRect(x, y, TILE, 3); ctx.fillRect(x+11, y+6, 5, 8); ctx.fillRect(x+22, y+18, 6, 9); ctx.fillRect(x+5, y+22, 4, 5);
      ctx.fillStyle = th.groundTop[0];
      ctx.fillRect(x+2, y+2, 8, 6); ctx.fillRect(x+20, y+4, 6, 4); ctx.fillRect(x+12, y+20, 5, 5);
      if(!isSolid(c, r-1)){
        ctx.fillStyle = th.groundTop[1]; ctx.fillRect(x, y, TILE, 5);
        ctx.fillStyle = th.groundTop[2]; ctx.fillRect(x, y+5, TILE, 3);
      }
    } else if(th.groundStyle === 'stone'){
      ctx.fillStyle = th.groundBody[0]; ctx.fillRect(x, y, TILE, TILE);
      ctx.fillStyle = th.groundBody[1];
      ctx.fillRect(x+1, y+1, 14, 14); ctx.fillRect(x+17, y+1, 14, 14);
      ctx.fillRect(x+1, y+17, 14, 14); ctx.fillRect(x+17, y+17, 14, 14);
      ctx.fillStyle = th.groundBody[2];
      ctx.fillRect(x+1, y+14, 14, 2); ctx.fillRect(x+17, y+14, 14, 2);
      ctx.fillRect(x+1, y+30, 14, 2); ctx.fillRect(x+17, y+30, 14, 2);
      if(!isSolid(c, r-1)){
        ctx.fillStyle = th.groundTop[0]; ctx.fillRect(x, y, TILE, TILE);
        ctx.fillStyle = th.groundTop[1];
        ctx.fillRect(x+2, y+2, 12, 5); ctx.fillRect(x+18, y+2, 12, 5);
      }
    } else if(th.groundStyle === 'cloud'){
      const topIsSolid = isSolid(c, r-1);
      ctx.fillStyle = th.groundBody[0]; ctx.fillRect(x, y, TILE, TILE);
      ctx.fillStyle = th.groundBody[1]; ctx.fillRect(x, y, TILE, 6);
      ctx.fillStyle = th.groundBody[2]; ctx.fillRect(x, y+26, TILE, 6);
      ctx.fillStyle = 'rgba(255,255,255,0.9)';
      ctx.beginPath(); ctx.arc(x+8, y+14, 6, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.arc(x+22, y+11, 5, 0, 7); ctx.fill();
      if(!topIsSolid){
        ctx.fillStyle = th.groundTop[0];
        ctx.beginPath(); ctx.arc(x+6, y+3, 7, 0, 7); ctx.fill();
        ctx.beginPath(); ctx.arc(x+16, y-1, 9, 0, 7); ctx.fill();
        ctx.beginPath(); ctx.arc(x+26, y+3, 7, 0, 7); ctx.fill();
        ctx.fillRect(x, y+2, TILE, 6);
        ctx.fillStyle = th.groundTop[1];
        ctx.beginPath(); ctx.arc(x+8, y+1, 4, 0, 7); ctx.fill();
        ctx.beginPath(); ctx.arc(x+16, y-2, 5, 0, 7); ctx.fill();
        ctx.beginPath(); ctx.arc(x+24, y+1, 4, 0, 7); ctx.fill();
      }
    } else if(th.groundStyle === 'sand'){
      ctx.fillStyle = th.groundBody[0]; ctx.fillRect(x, y, TILE, TILE);
      ctx.fillStyle = th.groundBody[1];
      ctx.fillRect(x, y+16, TILE, 2); ctx.fillRect(x+15, y, 2, 16);
      ctx.fillStyle = th.groundBody[2];
      for(let i=0;i<5;i++) ctx.fillRect(x + (i*7+3)%28, y + (i*11+5)%28, 2, 2);
      if(!isSolid(c,r-1)){
        ctx.fillStyle = th.groundTop[0]; ctx.fillRect(x, y, TILE, 6);
        ctx.fillStyle = th.groundTop[1]; ctx.fillRect(x, y, TILE, 3);
      }
    } else if(th.groundStyle === 'snow'){
      ctx.fillStyle = th.groundBody[0]; ctx.fillRect(x, y, TILE, TILE);
      ctx.fillStyle = th.groundBody[1]; ctx.fillRect(x, y+18, TILE, 14);
      ctx.fillStyle = th.groundBody[2]; ctx.fillRect(x, y+28, TILE, 4);
      if(!isSolid(c,r-1)){
        ctx.fillStyle = th.groundTop[0]; ctx.fillRect(x, y, TILE, 10);
        ctx.beginPath(); ctx.arc(x+8, y+3, 5, 0, 7); ctx.fill();
        ctx.beginPath(); ctx.arc(x+22, y+2, 6, 0, 7); ctx.fill();
        ctx.fillStyle = th.groundTop[1]; ctx.fillRect(x, y+9, TILE, 3);
      }
    } else if(th.groundStyle === 'volcanic'){
      ctx.fillStyle = th.groundBody[0]; ctx.fillRect(x, y, TILE, TILE);
      ctx.fillStyle = th.groundBody[1];
      ctx.fillRect(x+3, y+4, 10, 8); ctx.fillRect(x+18, y+15, 11, 9);
      ctx.fillStyle = th.groundBody[2];
      ctx.fillRect(x+20, y+6, 6, 5); ctx.fillRect(x+5, y+22, 8, 6);
      const lavaPulse = 0.4 + 0.3 * Math.sin(timeMs/500 + c*0.7);
      ctx.fillStyle = `rgba(255,80,20,${lavaPulse})`;
      ctx.fillRect(x, y+14, TILE, 1); ctx.fillRect(x+14, y, 1, TILE);
      if(!isSolid(c, r-1)){
        ctx.fillStyle = th.groundTop[0]; ctx.fillRect(x, y, TILE, TILE);
        ctx.fillStyle = th.groundTop[1]; ctx.fillRect(x, y, TILE, 5);
        ctx.fillStyle = 'rgba(255,100,30,0.35)'; ctx.fillRect(x, y+5, TILE, 2);
      }
    }
    if(r >= 17){
      const depth = Math.min(0.55, (r - 16) * 0.075);
      ctx.fillStyle = `rgba(0,0,0,${depth})`;
      ctx.fillRect(x, y, TILE, TILE);
      const h1 = ((c*73 + r*151) % 23) / 23;
      const h2 = ((c*29 + r*89) % 17) / 17;
      ctx.fillStyle = 'rgba(0,0,0,0.25)';
      ctx.fillRect(x + 4 + h1*18, y + 6 + h2*16, 3, 2);
      ctx.fillStyle = 'rgba(255,255,255,0.04)';
      ctx.fillRect(x + 4 + h1*18, y + 6 + h2*16 - 1, 3, 1);
    }
  }
  else if(t === 2){
    ctx.fillStyle = '#8c3216'; ctx.fillRect(x, y, TILE, TILE);
    ctx.fillStyle = '#c2542a';
    ctx.fillRect(x+1, y+1, 14, 13); ctx.fillRect(x+17, y+1, 14, 13);
    ctx.fillRect(x+1, y+16, 14, 15); ctx.fillRect(x+17, y+16, 14, 15);
    ctx.fillStyle = 'rgba(255,180,120,0.2)';
    ctx.fillRect(x+1, y+1, 14, 2); ctx.fillRect(x+17, y+1, 14, 2);
    ctx.fillRect(x+1, y+16, 14, 2); ctx.fillRect(x+17, y+16, 14, 2);
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.fillRect(x+1, y+13, 14, 1); ctx.fillRect(x+17, y+13, 14, 1);
    ctx.fillRect(x+1, y+30, 14, 1); ctx.fillRect(x+17, y+30, 14, 1);
  }
  else if(t === 3){
    const pulse = 0.5 + 0.5*Math.sin(timeMs/220 + c);
    ctx.save();
    ctx.shadowColor = '#ffd54f'; ctx.shadowBlur = 8 + pulse * 6;
    ctx.fillStyle = '#b06d0c'; ctx.fillRect(x, y, TILE, TILE);
    ctx.restore();
    ctx.fillStyle = '#f0a92a'; ctx.fillRect(x+2, y+2, TILE-4, TILE-4);
    ctx.fillStyle = `rgba(255,225,150,${0.35 + pulse*0.4})`; ctx.fillRect(x+3, y+3, TILE-6, 6);
    ctx.fillStyle = 'rgba(255,255,255,0.4)'; ctx.fillRect(x+3, y+3, TILE-6, 1);
    ctx.fillStyle = '#8a5408';
    [[5,5],[24,5],[5,24],[24,24]].forEach(([dx,dy]) => ctx.fillRect(x+dx, y+dy, 3, 3));
    ctx.save();
    ctx.fillStyle = '#7a4a06'; ctx.font = 'bold 21px monospace';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('?', x+16, y+17);
    ctx.restore();
  }
  else if(t === 4){
    ctx.fillStyle = '#6d4c41'; ctx.fillRect(x, y, TILE, TILE);
    ctx.fillStyle = '#8d6e63'; ctx.fillRect(x+2, y+2, TILE-4, TILE-4);
    ctx.fillStyle = 'rgba(255,255,255,0.1)'; ctx.fillRect(x+2, y+2, TILE-4, 2);
    ctx.fillStyle = '#4e342e';
    [[5,5],[24,5],[5,24],[24,24]].forEach(([dx,dy]) => ctx.fillRect(x+dx, y+dy, 3, 3));
  }
  else if(t === 5){
    const pc = th.pipeCol;
    const leftTile  = (c===0) || grid[r][c-1] !== 5;
    const rightTile = (c===levelCols-1) || grid[r][c+1] !== 5;
    const topTile   = (r===0) || grid[r-1][c] !== 5;
    ctx.fillStyle = pc[0]; ctx.fillRect(x+2, y, TILE-4, TILE);
    if(leftTile){ ctx.fillStyle = pc[1]; ctx.fillRect(x+5, y, 9, TILE); }
    if(rightTile){ ctx.fillStyle = pc[2]; ctx.fillRect(x+TILE-9, y, 7, TILE); }
    if(topTile){
      ctx.fillStyle = pc[0]; ctx.fillRect(x, y, TILE, 12);
      if(leftTile){ ctx.fillStyle = pc[1]; ctx.fillRect(x+3, y+2, 9, 8); }
      if(rightTile){ ctx.fillStyle = pc[2]; ctx.fillRect(x+TILE-9, y+2, 9, 8); }
      ctx.fillStyle = pc[2]; ctx.fillRect(x, y+10, TILE, 3);
      ctx.fillStyle = 'rgba(255,255,255,0.2)'; ctx.fillRect(x+3, y+2, 9, 2);
    }
  }
  else if(t === 6){
    ctx.fillStyle = '#5a5060'; ctx.fillRect(x, y+TILE-6, TILE, 6);
    ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fillRect(x, y+TILE-2, TILE, 2);
    ctx.fillStyle = '#d0d0e0';
    const spikes = 4, sw = TILE/spikes;
    for(let i=0;i<spikes;i++){
      ctx.beginPath();
      ctx.moveTo(x + i*sw, y+TILE-6);
      ctx.lineTo(x + i*sw + sw/2, y+6);
      ctx.lineTo(x + (i+1)*sw, y+TILE-6);
      ctx.closePath(); ctx.fill();
    }
    ctx.fillStyle = '#9090a8';
    for(let i=0;i<spikes;i++){
      ctx.beginPath();
      ctx.moveTo(x + i*sw + sw*0.35, y+TILE-6);
      ctx.lineTo(x + i*sw + sw/2, y+6);
      ctx.lineTo(x + i*sw + sw*0.55, y+TILE-6);
      ctx.closePath(); ctx.fill();
    }
  }
  else if(t === 7){
    ctx.fillStyle = '#5a5060'; ctx.fillRect(x, y, TILE, 6);
    ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fillRect(x, y, TILE, 2);
    ctx.fillStyle = '#d0d0e0';
    const spikes = 4, sw = TILE/spikes;
    for(let i=0;i<spikes;i++){
      ctx.beginPath();
      ctx.moveTo(x + i*sw, y+6);
      ctx.lineTo(x + i*sw + sw/2, y+TILE-6);
      ctx.lineTo(x + (i+1)*sw, y+6);
      ctx.closePath(); ctx.fill();
    }
    ctx.fillStyle = '#9090a8';
    for(let i=0;i<spikes;i++){
      ctx.beginPath();
      ctx.moveTo(x + i*sw + sw*0.35, y+6);
      ctx.lineTo(x + i*sw + sw/2, y+TILE-6);
      ctx.lineTo(x + i*sw + sw*0.55, y+6);
      ctx.closePath(); ctx.fill();
    }
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    for(let i=0;i<spikes;i++){
      ctx.fillRect(x + i*sw + sw/2 - 1, y+14, 1, 8);
    }
  }
}

function paintCharRaw(ch, frame, walking, air, starTint){
  const R = (px,py,w,h,col) => { ctx.fillStyle = col; ctx.fillRect(Math.round(px), Math.round(py), Math.round(w), Math.round(h)); };
  let SKIN = ch.skin, SKIN_D = ch.skinD;
  let HAT = ch.hat, HAT_L = ch.hat2;
  let SHIRT = ch.shirt, SHIRT_L = ch.shirt2;
  const SHOE = ch.shoes, BROWN = '#3e2723';
  const female = ch.style === 'f';
  const HAIR = ch.hair || '#5a3a1a', HAIR_D = ch.hairDark || '#3a2010';
  const OUTLINE = 'rgba(0,0,0,0.22)';
  const SHADE = 'rgba(0,0,0,0.18)';
  const HL = 'rgba(255,255,255,0.28)';
  const HL2 = 'rgba(255,255,255,0.15)';
  const SOLE = 'rgba(0,0,0,0.4)';

  if(starTint){
    const colors = ['#ff1744','#ff9100','#ffea00','#00e676','#00b0ff','#d500f9'];
    const idx = Math.floor(timeMs/70) % colors.length;
    HAT = HAT_L = colors[idx];
    SHIRT = SHIRT_L = colors[(idx+3) % colors.length];
  }

  let s1 = 0, s2 = 0;
  if(air){ s1 = -2; s2 = -1; }
  else if(walking){
    s1 = [0, -2, 0, 0][frame];
    s2 = [0, 0, 0, -2][frame];
  }

  if(female){
    R(-13, 8, 26, 20, HAIR_D);
    R(-12, 8, 24, 4, HAIR);
    R(-13, 26, 4, 3, HAIR_D);
    R(-7, 26, 4, 2, HAIR_D);
    R(3, 26, 4, 2, HAIR_D);
    R(9, 26, 4, 3, HAIR_D);
    R(-11, 9, 3, 12, HL2);
  }

  R(-8, 24, 6, 6, SHIRT);
  R(2, 24, 6, 6, SHIRT);
  R(-2, 24, 4, 6, SHADE);
  R(-8, 24, 6, 1, HL2);
  R(2, 24, 6, 1, HL2);

  if(female){
    R(-10, 29+s1, 9, 3, SHOE);
    R(-10, 31+s1, 9, 1, SOLE);
    R(-10, 29+s1, 9, 1, HL2);
    R(-3, 29+s1, 3, 1, HL2);
    R(-1, 29+s2, 9, 3, SHOE);
    R(-1, 31+s2, 9, 1, SOLE);
    R(-1, 29+s2, 9, 1, HL2);
    R(5, 29+s2, 3, 1, HL2);
  } else {
    R(-11, 29+s1, 10, 3, SHOE);
    R(-11, 31+s1, 10, 1, SOLE);
    R(-11, 29+s1, 10, 1, HL2);
    R(-3, 29+s1, 3, 3, HL2);
    R(1, 29+s2, 10, 3, SHOE);
    R(1, 31+s2, 10, 1, SOLE);
    R(1, 29+s2, 10, 1, HL2);
    R(4, 29+s2, 3, 3, HL2);
  }

  R(-9, 15, 18, 11, HAT);
  R(-7, 17, 14, 12, SHIRT);
  R(-6, 18, 3, 3, SHIRT_L);
  R(3, 18, 3, 3, SHIRT_L);
  R(-9, 15, 18, 1, HL);
  R(-9, 25, 18, 1, OUTLINE);
  R(-7, 19, 1, 1, HAT_L);
  R(-7, 22, 1, 1, HAT_L);

  const armUp = air ? -4 : 0;
  R(-13, 15+armUp, 5, 8, HAT);
  R(8, 15+armUp, 5, 8, HAT);
  R(-13, 22+armUp, 5, 1, 'rgba(0,0,0,0.2)');
  R(8, 22+armUp, 5, 1, 'rgba(0,0,0,0.2)');
  R(-13, 22+armUp, 5, 5, SKIN);
  R(8, 22+armUp, 5, 5, SKIN);
  R(-13, 22+armUp, 5, 1, HL2);
  R(8, 22+armUp, 5, 1, HL2);
  R(-13, 15+armUp, 5, 1, HL2);
  R(8, 15+armUp, 5, 1, HL2);

  R(-8, 5, 16, 11, SKIN);
  R(-7, 12, 3, 3, 'rgba(220,140,120,0.35)');
  R(4, 12, 3, 3, 'rgba(220,140,120,0.35)');
  R(-6, 15, 12, 1, SHADE);

  R(-9, 1, 18, 6, HAT);
  R(-9, 4, 18, 2, 'rgba(0,0,0,0.28)');
  R(-11, 5, 22, 3, HAT);
  R(-8, 1, 6, 3, HAT_L);
  R(-11, 5, 22, 1, HL);
  R(-11, 8, 22, 1, OUTLINE);

  if(female){
    R(-11, 8, 3, 14, HAIR);
    R(8, 8, 3, 14, HAIR);
    R(-8, 5, 4, 4, HAIR);
    R(4, 5, 4, 4, HAIR);
    R(-10, 9, 1, 8, HL2);
    R(8, 9, 1, 8, HL2);
  }

  R(0, 6, 5, 1, BROWN);
  R(1, 9, 4, 4, '#ffffff');
  R(3, 10, 2, 2, '#1a1a1a');
  R(3, 10, 1, 1, '#ffffff');
  R(6, 11, 5, 3, SKIN);
  R(6, 13, 5, 1, SKIN_D);
  if(!female){
    R(-2, 13, 11, 3, BROWN);
    R(-1, 13, 9, 1, 'rgba(255,255,255,0.15)');
    R(0, 16, 6, 1, 'rgba(80,20,10,0.6)');
  } else {
    R(-2, 13, 5, 2, '#d81b60');
    R(-2, 13, 5, 1, 'rgba(255,180,200,0.5)');
  }
  R(-9, 10, 3, 4, SKIN_D);
  R(-9, 10, 3, 1, 'rgba(255,255,255,0.25)');
}

function paintChar(x, y, ch, frame=0, walking=false, air=false, facing=1){
  ctx.save();
  ctx.translate(x + 11, y);
  ctx.scale(facing, 1);
  ctx.translate(-11, 0);
  paintCharRaw(ch, frame, walking, air, false);
  ctx.restore();
}

function drawPero(){
  const px = Math.round(p.x - camera.x);
  const py = Math.round(p.y);
  const ch = currentChar();
  const walking = Math.abs(p.vx) > 0.3 && p.onGround;
  const frame = walking ? Math.floor(p.anim) % 4 : 0;
  const air = !p.onGround;
  const spriteW = 22, spriteH = 32;
  const scaleX = p.w / spriteW, scaleY = p.h / spriteH;

  ctx.save();
  if(p.invulnTimer > 0 && p.starTimer === 0)
    ctx.globalAlpha = 0.35 + 0.65 * Math.abs(Math.sin(timeMs/55));
  ctx.translate(px + p.w/2, py + p.h);
  ctx.scale(scaleX * (p.facing < 0 ? -1 : 1), scaleY);
  ctx.translate(-spriteW/2, -spriteH);
  if(!p.alive){
    const rot = Math.min(1, stateTimer/40) * 0.8;
    ctx.translate(spriteW/2, spriteH/2); ctx.rotate(rot); ctx.translate(-spriteW/2, -spriteH/2);
    paintCharRaw(ch, 0, false, true, false);
  } else {
    paintCharRaw(ch, frame, walking, air, p.starTimer > 0);
  }
  ctx.restore();
}

function drawPowerup(pu){
  const x = Math.round(pu.x - camera.x);
  const y = Math.round(pu.y);
  const w = pu.w, h = pu.h;
  if(pu.type === 'mushroom'){
    ctx.fillStyle = 'rgba(0,0,0,0.2)';
    ctx.beginPath(); ctx.ellipse(x + w/2, y + h + 2, w*0.5, 3, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#e53935';
    ctx.beginPath(); ctx.arc(x+w/2, y+h*0.45, w/2, Math.PI, 0); ctx.fill();
    ctx.fillRect(x, y+h*0.42, w, h*0.18);
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(x+w*0.28, y+h*0.30, 3, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(x+w*0.72, y+h*0.30, 3, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(x+w*0.50, y+h*0.14, 2.5, 0, 7); ctx.fill();
    ctx.fillStyle = '#fff3e0'; ctx.fillRect(x+w*0.20, y+h*0.60, w*0.60, h*0.40);
    ctx.fillStyle = '#ffcc80'; ctx.fillRect(x+w*0.20, y+h*0.60, w*0.60, 2);
    ctx.fillStyle = '#000'; ctx.fillRect(x+w*0.35, y+h*0.72, 2, 3); ctx.fillRect(x+w*0.60, y+h*0.72, 2, 3);
  }
  else if(pu.type === 'star'){
    const glow = 0.5 + 0.5*Math.sin(pu.t/6);
    ctx.save();
    ctx.shadowColor = '#ffeb3b'; ctx.shadowBlur = 18*glow;
    ctx.fillStyle = '#ffeb3b';
    ctx.translate(x+w/2, y+h/2); ctx.rotate(pu.t*0.05);
    const spikes = 5, outer = w/2+2, inner = w/4;
    ctx.beginPath();
    for(let i=0;i<spikes*2;i++){
      const rr = i%2===0 ? outer : inner;
      const a = (i/(spikes*2))*Math.PI*2 - Math.PI/2;
      const pxx = Math.cos(a)*rr, pyy = Math.sin(a)*rr;
      if(i===0) ctx.moveTo(pxx, pyy); else ctx.lineTo(pxx, pyy);
    }
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#fff59d'; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.fillStyle = '#000'; ctx.fillRect(-4, -2, 2, 3); ctx.fillRect(2, -2, 2, 3);
    ctx.restore();
  }
  else if(pu.type === '1up'){
    ctx.fillStyle = 'rgba(0,0,0,0.2)';
    ctx.beginPath(); ctx.ellipse(x + w/2, y + h + 2, w*0.5, 3, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#2e7d32';
    ctx.beginPath(); ctx.arc(x+w/2, y+h*0.45, w/2, Math.PI, 0); ctx.fill();
    ctx.fillRect(x, y+h*0.42, w, h*0.18);
    ctx.fillStyle = '#a5d6a7';
    ctx.beginPath(); ctx.arc(x+w*0.28, y+h*0.30, 3, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(x+w*0.72, y+h*0.30, 3, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(x+w*0.50, y+h*0.14, 2.5, 0, 7); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.fillRect(x+w*0.20, y+h*0.60, w*0.60, h*0.40);
    ctx.fillStyle = '#c8e6c9'; ctx.fillRect(x+w*0.20, y+h*0.60, w*0.60, 2);
    ctx.fillStyle = '#2e7d32'; ctx.fillRect(x+w*0.42, y+h*0.68, 3, 10); ctx.fillRect(x+w*0.32, y+h*0.76, 10, 3);
  }
}

function drawEnemy(e){
  const R = (x,y,w,h,col) => { ctx.fillStyle = col; ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h)); };
  const x = Math.round(e.x - camera.x);
  const y = Math.round(e.y);
  if(x < -100 || x > W + 100) return;

  if(!e.alive){
    if(e.kind === 'spider'){
      R(x+2, y+14, 16, 4, '#1a1a1a');
      R(x+6, y+16, 8, 2, '#3a1a1a');
    } else {
      R(x+1, y+e.h-8, e.w-2, 7, '#4e342e');
      R(x+3, y+e.h-7, e.w-6, 3, '#8d6e63');
    }
    return;
  }

  if(e.kind === 'bird'){
    ctx.save();
    ctx.translate(x + e.w/2, y);
    ctx.scale(e.dir < 0 ? -1 : 1, 1);
    ctx.translate(-e.w/2, 0);
    const flap = Math.sin(timeMs/100) * 4;
    R(6, 6, 12, 10, '#5c4033');
    R(8, 4, 8, 3, '#8a6a4a');
    R(14, 3, 8, 8, '#7a5a3a');
    R(18, 5, 2, 3, '#fff');
    R(18.5, 5.5, 1, 2, '#000');
    R(21, 7, 4, 3, '#ffb300');
    R(2, 7+flap, 8, 5, '#8a6a4a');
    R(1, 3+flap, 3, 4, '#a08060');
    R(0, 9, 7, 4, '#5c4033');
    R(8, 4, 6, 1, 'rgba(255,255,255,0.3)');
    ctx.restore();
  }
  else if(e.kind === 'spider'){
    const threadTop = 0;
    ctx.strokeStyle = 'rgba(220,220,220,0.6)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x + e.w/2, threadTop); ctx.lineTo(x + e.w/2, y + 4); ctx.stroke();
    ctx.fillStyle = '#2a1010';
    ctx.beginPath(); ctx.arc(x + e.w/2, y + 10, 9, 0, 7); ctx.fill();
    ctx.fillStyle = '#3a1818';
    ctx.beginPath(); ctx.arc(x + e.w/2, y + 8, 7, 0, 7); ctx.fill();
    ctx.strokeStyle = '#1a0808'; ctx.lineWidth = 2;
    const wig = Math.sin(timeMs/150) * 1.5;
    for(let i=0;i<4;i++){
      ctx.beginPath();
      ctx.moveTo(x + 4, y + 8 + i*2);
      ctx.lineTo(x - 2, y + 6 + i*3 + (i%2?wig:-wig));
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(x + e.w - 4, y + 8 + i*2);
      ctx.lineTo(x + e.w + 2, y + 6 + i*3 + (i%2?-wig:wig));
      ctx.stroke();
    }
    ctx.fillStyle = '#ff3030';
    ctx.fillRect(x + 6, y + 6, 3, 3);
    ctx.fillRect(x + e.w - 9, y + 6, 3, 3);
    ctx.fillStyle = '#ff9090';
    ctx.fillRect(x + 7, y + 7, 1, 1);
    ctx.fillRect(x + e.w - 8, y + 7, 1, 1);
  }
  else if(e.kind === 'jumper'){
    const bodyH = e.onGround ? 22 : 26;
    const bodyY = y + (e.h - bodyH);
    R(x+3, bodyY+2, 20, bodyH-4, '#2e7d32');
    R(x+5, bodyY, 16, bodyH-2, '#43a047');
    R(x+7, bodyY-2, 12, 4, '#66bb6a');
    R(x+7, bodyY+6, 5, 6, '#fff');
    R(x+14, bodyY+6, 5, 6, '#fff');
    R(x+8, bodyY+8, 3, 3, '#000');
    R(x+15, bodyY+8, 3, 3, '#000');
    R(x+8, bodyY+14, 10, 1, '#1b5e20');
    R(x+9, bodyY+15, 8, 1, '#1b5e20');
    R(x+6, bodyY+3, 6, 1, '#1b5e20');
    R(x+13, bodyY+3, 6, 1, '#1b5e20');
    const wobble = e.onGround ? 0 : 2;
    R(x+4, y+e.h-4+wobble, 8, 4, '#1b5e20');
    R(x+14, y+e.h-4+wobble, 8, 4, '#1b5e20');
    R(x+6, bodyY+1, 8, 1, 'rgba(255,255,255,0.35)');
  }
  else if(e.kind === 'fireball'){
    const pulse = 0.8 + 0.2 * Math.sin(timeMs/80);
    ctx.save();
    ctx.shadowColor = '#ff4400'; ctx.shadowBlur = 18 * pulse;
    ctx.fillStyle = '#d32f2f';
    ctx.beginPath(); ctx.arc(x + e.w/2, y + e.h/2, 10 * pulse, 0, 7); ctx.fill();
    ctx.fillStyle = '#ff6f00';

    ctx.restore();
    for(let i=0;i<3;i++){

  else {
    const wig = Math.floor(timeMs/160) % 2;

}

function drawHazard(h){
  const x = Math.round(h.x - camera.x);
  const y = Math.round(h.y);
  if(x < -50 || x > W + 50) return;
  ctx.strokeStyle = '#4a4a5a'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, y); ctx.stroke();
  ctx.strokeStyle = '#6a6a7a'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(x-1, 0); ctx.lineTo(x-1, y); ctx.stroke();
  const R = h.r;
  ctx.save();
  ctx.shadowColor = '#ff5050'; ctx.shadowBlur = 8;
  ctx.fillStyle = '#2a2a3a';
  for(let i=0;i<8;i++){
    const a = (i/8)*Math.PI*2 + h.t;
    const sx = x + Math.cos(a)*(R+5);
    const sy = y + Math.sin(a)*(R+5);
    ctx.beginPath();
    ctx.moveTo(x + Math.cos(a)*R, y + Math.sin(a)*R);
    ctx.lineTo(sx + Math.cos(a+0.5)*3, sy + Math.sin(a+0.5)*3);
    ctx.lineTo(sx + Math.cos(a-0.5)*3, sy + Math.sin(a-0.5)*3);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();
  ctx.fillStyle = '#5a5a70';
  ctx.beginPath(); ctx.arc(x, y, R, 0, 7); ctx.fill();
  ctx.fillStyle = '#7a7a90';
  ctx.beginPath(); ctx.arc(x - 3, y - 3, R*0.5, 0, 7); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.35)';
  ctx.beginPath(); ctx.arc(x - 4, y - 4, R*0.25, 0, 7); ctx.fill();
  ctx.strokeStyle = '#1a1a2a'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(x, y, R, 0, 7); ctx.stroke();
}

function drawCoin(c){
  if(c.taken) return;
  const x = Math.round(c.x - camera.x);
  const y = Math.round(c.y);
  if(x < -40 || x > W + 40) return;
  const w = Math.abs(Math.cos(c.t)) * 8 + 2;
  ctx.fillStyle = '#ffb300';
  ctx.beginPath(); ctx.ellipse(x, y, w, 11, 0, 0, 7); ctx.fill();
  ctx.fillStyle = '#ffd54f';
  ctx.beginPath(); ctx.ellipse(x, y, Math.max(1,w-2), 9, 0, 0, 7); ctx.fill();
  ctx.fillStyle = '#fff59d';
  ctx.beginPath(); ctx.ellipse(x-w*0.25, y-3, Math.max(0.5,w*0.28), 3.5, 0, 0, 7); ctx.fill();
  if(w > 3){
    const tw = Math.sin(c.t * 3) * 0.5 + 0.5;
    ctx.fillStyle = `rgba(255,255,255,${tw * 0.7})`;
    ctx.beginPath(); ctx.arc(x - w*0.15, y - 6, 1.5, 0, 7); ctx.fill();
  }
}

function drawParticles(){
  for(const pt of particles){
    const x = Math.round(pt.x - camera.x);
    const y = Math.round(pt.y);
    const a = pt.life / pt.max;
    ctx.globalAlpha = Math.max(0, a);
    if(pt.coin){
      const w = Math.abs(Math.cos(pt.life*0.35)) * 8 + 2;
      ctx.fillStyle = '#ffd54f';
      ctx.beginPath(); ctx.ellipse(x, y, w, 11, 0, 0, 7); ctx.fill();
    } else {
      ctx.fillStyle = pt.col; ctx.fillRect(x, y, pt.size, pt.size);
    }
    ctx.globalAlpha = 1;
  }
}

function render(){
  drawBackground();

  const c0 = Math.max(0, Math.floor(camera.x/TILE) - 1);
  const c1 = Math.min(levelCols-1, Math.floor((camera.x + W)/TILE) + 1);
  for(let r=0;r<ROWS;r++){
    for(let c=c0;c<=c1;c++){
      const t = grid[r][c];
      if(t === 0) continue;
      const bump = bumps[r*levelCols + c] || 0;
      drawTile(c, r, t, Math.round(c*TILE - camera.x),
               Math.round(r*TILE - (bump ? Math.sin(bump/10*Math.PI)*7 : 0)));
    }
  }
  drawLava();
  drawFlagAndCastle();
  drawAmbients();
  for(const c of coins) drawCoin(c);
  for(const e of enemies) drawEnemy(e);
  for(const pu of powerups) drawPowerup(pu);
  for(const h of hazards) drawHazard(h);
  drawParticles();
  if(state !== 'gameover' && state !== 'menu'){
    if(p.alive || state === 'dead') drawPero();
  }
  if(state === 'playing' || state === 'dead' || state === 'levelclear' ||
     state === 'win' || state === 'paused') drawHUD();

  // Dodirne tipke — iznad svega u igri
  drawTouchControls();

  if(state !== 'menu') drawVignette();
  drawOverlay();
}

let last = performance.now(), acc = 0;
const STEP = 1000/60;

function loop(now){
  requestAnimationFrame(loop);
  let dt = now - last; last = now;
  if(dt > 200) dt = 200;
  acc += dt; timeMs = now;

  while(acc >= STEP){
    acc -= STEP;
    if(state === 'playing'){
      updatePlayer();
      updateEnemies();
      updatePowerups();
      updateHazards();
      updateParticles();
      updateCamera();
      updateAmbients();
    }
    else if(state === 'dead'){
      stateTimer++;
      p.vy += GRAV * 0.8; p.y += p.vy;
      updateParticles(); updateAmbients();
      if(stateTimer > 95){
        lives--;
        if(lives <= 0){
          save.wallet += coinCount; writeSave();
          state = 'gameover'; stateTimer = 0;
        } else {
          if(gameMode === 'hardcore'){ currentLevel = 1; spawnCol = 3; startLevel(3); }
          else { startLevel(spawnCol); }
        }
      }
    }
    else if(state === 'levelclear'){
      stateTimer++;
      updateParticles(); updateAmbients();
      p.vx = 2.2; p.x += p.vx; p.anim += 0.16;
      p.facing = 1; p.vy += GRAV; moveY(p, false);
      updateCamera();
      if(stateTimer > 140){
        if(currentLevel < TOTAL_LEVELS){
          currentLevel++; spawnCol = 3;
          if(currentLevel > save.unlockedLevels){ save.unlockedLevels = currentLevel; writeSave(); }
          startLevel(3);
        } else { win(); }
      }
    }
    else if(state === 'win'){
      stateTimer++;
      updateParticles(); updateAmbients();
      p.vx = 2.2; p.x += p.vx; p.anim += 0.16;
      p.facing = 1; p.vy += GRAV; moveY(p, false);
      updateCamera();
    }
    else {
      for(const c of coins) c.t += 0.12;
    }
    for(const c of coins) if(!c.taken) c.t += 0.09;
  }
  render();
}

function handleMenuInput(e){
  if(menuScreen === 'main'){
    const items = MAIN_MENU.length;
    if(e.code === 'ArrowUp' || e.code === 'KeyW'){ menuCursor = (menuCursor + items - 1) % items; beep(500,0.05,'square',0.03); }
    else if(e.code === 'ArrowDown' || e.code === 'KeyS'){ menuCursor = (menuCursor + 1) % items; beep(500,0.05,'square',0.03); }
    else if(e.code === 'Enter' || e.code === 'Space'){
      beep(700,0.08,'square',0.05);
      const id = MAIN_MENU[menuCursor].id;
      if(id === 'campaign'){
        const startLvl = Math.min(save.checkpoint, LAST_CHECKPOINT);
        startGame('campaign', startLvl);
      } else if(id === 'hardcore'){ startGame('hardcore', 1); }
      else if(id === 'freeplay'){ menuScreen = 'levels'; levelCursor = 0; }
      else if(id === 'chars'){ menuScreen = 'chars'; menuCursor = Math.max(0, save.owned.indexOf(save.selected)); }
      else if(id === 'shop'){
        menuScreen = 'shop'; shopTab = 'chars';
        menuCursor = Math.max(0, CHARACTERS.findIndex(c => c.id === save.selected));
      } else if(id === 'controls'){
        menuScreen = 'controls';
        menuCursor = Math.max(0, CONTROL_OPTIONS.findIndex(o => o.id === save.inputMode));
      } else if(id === 'help'){ menuScreen = 'help'; }
    }
  }
  else if(menuScreen === 'levels'){
    const half = Math.ceil(TOTAL_LEVELS / 2);
    if(e.code === 'ArrowUp' || e.code === 'KeyW'){ levelCursor = (levelCursor - 1 + TOTAL_LEVELS) % TOTAL_LEVELS; beep(500,0.05,'square',0.03); }
    else if(e.code === 'ArrowDown' || e.code === 'KeyS'){ levelCursor = (levelCursor + 1) % TOTAL_LEVELS; beep(500,0.05,'square',0.03); }
    else if(e.code === 'ArrowLeft' || e.code === 'KeyA'){
      if(levelCursor >= half) levelCursor -= half;
      else levelCursor = (levelCursor + half) % TOTAL_LEVELS;
      if(levelCursor >= TOTAL_LEVELS) levelCursor = levelCursor % TOTAL_LEVELS;
      beep(500,0.05,'square',0.03);
    }
    else if(e.code === 'ArrowRight' || e.code === 'KeyD'){
      if(levelCursor < half){ const t = levelCursor + half; if(t < TOTAL_LEVELS) levelCursor = t; }
      else { levelCursor -= half; }
      beep(500,0.05,'square',0.03);
    }
    else if(e.code === 'Enter' || e.code === 'Space'){
      const lvl = levelCursor + 1;
      if(lvl <= save.unlockedLevels){ startGame('freeplay', lvl); beep(880,0.12,'square',0.06,1200); }
      else { beep(150,0.2,'square',0.05,90); }
    }
    else if(e.code === 'Escape' || e.code === 'Backspace'){ menuScreen = 'main'; menuCursor = 2; }
  }
  else if(menuScreen === 'chars'){
    if(e.code === 'ArrowLeft' || e.code === 'KeyA'){ menuCursor = (menuCursor + save.owned.length - 1) % save.owned.length; beep(500,0.05,'square',0.03); }
    else if(e.code === 'ArrowRight' || e.code === 'KeyD'){ menuCursor = (menuCursor + 1) % save.owned.length; beep(500,0.05,'square',0.03); }
    else if(e.code === 'Enter' || e.code === 'Space'){ save.selected = save.owned[menuCursor]; writeSave(); beep(900,0.1,'square',0.06); }
    else if(e.code === 'Escape' || e.code === 'Backspace'){ menuScreen = 'main'; menuCursor = 3; }
  }
  else if(menuScreen === 'shop'){
    if(e.code === 'Tab' || e.code === 'KeyQ'){ shopTab = shopTab === 'chars' ? 'bonus' : 'chars'; menuCursor = 0; beep(600,0.06,'square',0.04); e.preventDefault(); }
    else if(shopTab === 'chars'){
      if(e.code === 'ArrowLeft' || e.code === 'KeyA'){ menuCursor = (menuCursor + CHARACTERS.length - 1) % CHARACTERS.length; beep(500,0.05,'square',0.03); }
      else if(e.code === 'ArrowRight' || e.code === 'KeyD'){ menuCursor = (menuCursor + 1) % CHARACTERS.length; beep(500,0.05,'square',0.03); }
      else if(e.code === 'Enter' || e.code === 'Space'){
        const ch = CHARACTERS[menuCursor];
        if(save.owned.includes(ch.id)){ save.selected = ch.id; writeSave(); beep(700,0.08,'square',0.05); }
        else if(save.wallet >= ch.price){
          save.wallet -= ch.price; save.owned.push(ch.id); save.selected = ch.id; writeSave();
          beep(900,0.15,'square',0.06,1400);
        } else { beep(150,0.2,'square',0.05,90); }
      }
    }
    else {
      if(e.code === 'ArrowLeft' || e.code === 'KeyA'){ menuCursor = (menuCursor + BONUSES.length - 1) % BONUSES.length; beep(500,0.05,'square',0.03); }
      else if(e.code === 'ArrowRight' || e.code === 'KeyD'){ menuCursor = (menuCursor + 1) % BONUSES.length; beep(500,0.05,'square',0.03); }
      else if(e.code === 'Enter' || e.code === 'Space'){
        const b = BONUSES[menuCursor];
        if(hasBonus(b.id)){ beep(500,0.1,'square',0.04); }
        else if(save.wallet >= b.price){
          save.wallet -= b.price; save.bonuses.push(b.id); writeSave();
          beep(900,0.2,'square',0.07,1500);
        } else { beep(150,0.2,'square',0.05,90); }
      }
    }
    if(e.code === 'Escape' || e.code === 'Backspace'){ menuScreen = 'main'; menuCursor = 4; }
  }
  else if(menuScreen === 'controls'){
    if(e.code === 'ArrowUp' || e.code === 'KeyW'){ menuCursor = (menuCursor + CONTROL_OPTIONS.length - 1) % CONTROL_OPTIONS.length; beep(500,0.05,'square',0.03); }
    else if(e.code === 'ArrowDown' || e.code === 'KeyS'){ menuCursor = (menuCursor + 1) % CONTROL_OPTIONS.length; beep(500,0.05,'square',0.03); }
    else if(e.code === 'Enter' || e.code === 'Space'){
      save.inputMode = CONTROL_OPTIONS[menuCursor].id;
      writeSave();
      clearKeys();
      beep(880,0.15,'square',0.06,1200);
    }
    else if(e.code === 'Escape' || e.code === 'Backspace'){ menuScreen = 'main'; menuCursor = 5; }
  }
  else if(menuScreen === 'help'){
    if(e.code === 'Escape' || e.code === 'Backspace' || e.code === 'Enter'){ menuScreen = 'main'; menuCursor = 6; }
  }
}

addEventListener('keydown', e => {
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space','Tab'].includes(e.code)) e.preventDefault();
  keys[e.code] = true;
  if(e.repeat) return;
  if(e.code === 'KeyM' && state !== 'playing' && state !== 'paused') soundOn = !soundOn;
  if(state === 'menu'){ handleMenuInput(e); return; }
  if(state === 'playing'){
    if(e.code === 'KeyP' || e.code === 'Escape'){ prevState = 'playing'; state = 'paused'; clearKeys(); beep(400,0.1,'square',0.05,300); return; }
    if(e.code === 'KeyR'){ score=0; coinCount=0; spawnCol=3; lives = hasBonus('extraLife') ? 4 : 3; startLevel(3); }
  }
  else if(state === 'paused'){
    if(e.code === 'Escape' || e.code === 'KeyP' || e.code === 'KeyQ'){ state = 'playing'; beep(600,0.1,'square',0.05,800); }
    else if(e.code === 'KeyR'){ score=0; coinCount=0; spawnCol=3; lives = hasBonus('extraLife') ? 4 : 3; startLevel(3); }
    else if(e.code === 'KeyM'){ state = 'menu'; menuScreen = 'main'; menuCursor = 0; }
  }
  else if(state === 'gameover'){
    if(e.code === 'Enter'){
      if(gameMode === 'hardcore'){ startGame('hardcore', 1); }
      else if(gameMode === 'freeplay'){ state = 'menu'; menuScreen = 'levels'; levelCursor = 0; }
      else { const startLvl = Math.min(save.checkpoint, LAST_CHECKPOINT); startGame('campaign', startLvl); }
    }
    else if(e.code === 'Escape'){ state = 'menu'; menuScreen = 'main'; menuCursor = 0; }
  }
  else if(state === 'win'){
    if(e.code === 'Enter' || e.code === 'Escape'){ state = 'menu'; menuScreen = 'main'; menuCursor = 0; }
  }
});

addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for(const k in keys) keys[k] = false; activeTouches.clear(); });

buildLevel(1);
p.x = 3*TILE; p.y = 15*TILE - p.h;
requestAnimationFrame(loop);

})();
</script>
</body>
</html>
